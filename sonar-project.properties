# SonarQube Scanner configuration for Publications Management System (PMS)
sonar.projectKey=pms-vub-academic
sonar.projectName=Publications Management System (PMS)
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/tests/**
sonar.exclusions=**/migrations/**,**/.venv/**,**/static/**,**/media/**,**/graphify-out/**,manage.py

# Encoding and Language
sonar.sourceEncoding=UTF-8
sonar.language=py
sonar.python.version=3.11, 3.12, 3.14

# Test & Coverage reports (if pytest-cov is run)
sonar.python.coverage.reportPaths=coverage.xml
